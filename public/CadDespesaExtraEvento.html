<link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="stylesheet" href="css/MensagensSwal/mensagensSwal.css">
<link rel="stylesheet" href="css/Modal/CadDespesaExtraEvento.css">
<link rel="stylesheet" href="css/Roots/Roots.css">

<div id="cadModalDespesaExtra" class="modal">
    <div class="modal-content">

        <div class="Close"><button class="close" id="Fechar"> X </button></div>

        <div id="form-despesaextra">
            <div class="title">
                <h1>Despesa Extra</h1>
            </div>

            <form id="form" name="form">
                <fieldset>
                    <legend>Novo Lançamento</legend>

                    <div class="form-1coluna">
                        <div class="form campo-flutuante">
                            <select id="tipoLancamentoSelect">
                                <option value="Evento">Despesa de Evento</option>
                                <option value="Escritorio">Despesa de Escritório</option>
                            </select>
                            <label for="tipoLancamentoSelect" class="label-flutuante">Tipo de Lançamento</label>
                        </div>
                    </div>

                    <div id="blocoCamposEvento">
                        <div class="form-1coluna">
                            <div class="form campo-flutuante busca-evento-wrap">
                                <label class="label-flutuante label-sempre">Evento</label>
                                <div class="busca-evento-box">
                                    <i class="ri-search-line"></i>
                                    <input type="text" id="buscaEventoInput" placeholder="Buscar evento..." autocomplete="off">
                                    <button type="button" id="btnMostrarTodosEventos" class="busca-evento-toggle" title="Ver todos os eventos" aria-label="Ver todos os eventos"></button>
                                </div>
                                <input type="hidden" id="idEventoSelecionado">
                                <input type="hidden" id="anoEventoSelecionado">
                                <input type="hidden" id="dtReferenciaSelecionada">
                                <span id="eventoSelecionadoResumo" class="evento-resumo"></span>
                                <ul id="buscaEventoLista" class="busca-evento-lista" style="display:none;"></ul>
                            </div>
                        </div>

                        <div class="form-1coluna">
                            <div class="form">
                                <select id="idOrcamentoSelect" disabled>
                                    <option value="">Selecione um evento primeiro...</option>
                                </select>
                            </div>
                        </div>
                    </div>

                    <div id="blocoCampoDataEscritorio" class="form-1coluna" style="display:none;">
                        <div class="form campo-flutuante">
                            <input type="date" id="dtReferenciaEscritorioInput">
                            <label for="dtReferenciaEscritorioInput" class="label-flutuante label-sempre">Data da despesa</label>
                        </div>
                    </div>

                    <div class="form-2colunas">
                        <div class="form campo-flutuante">
                            <select name="categoria" id="categoriaSelect" required>
                                <option value="" disabled selected>Categoria...</option>
                                <option value="Quebra de Equipamento">Quebra de Equipamento</option>
                                <option value="Multa">Multa</option>
                                <option value="Reposição de Suprimento">Reposição de Suprimento</option>
                                <option value="Outro">Outro</option>
                            </select>
                            <label for="categoriaSelect" class="label-flutuante">Categoria</label>
                        </div>
                        <div class="form campo-flutuante">
                            <select name="tipo" id="tipoSelect" required>
                                <option value="" disabled selected>Tipo...</option>
                                <option value="Despesa">Despesa (aumenta o custo do evento)</option>
                                <option value="Estorno">Estorno (reduz o custo do evento)</option>
                            </select>
                            <label for="tipoSelect" class="label-flutuante">Tipo</label>
                        </div>
                    </div>

                    <div class="form-1coluna">
                        <div class="form" style="flex-direction: row; align-items: center; gap: 8px;">
                            <label for="valorInput" style="white-space: nowrap;">Valor (R$)</label>
                            <input type="text" name="valor" id="valorInput" placeholder="0,00" required>
                        </div>
                    </div>

                    <div class="form-1coluna">
                        <div class="form campo-flutuante">
                            <textarea name="justificativa" id="justificativaInput" rows="3" required placeholder="Justificativa..."></textarea>
                            <label for="justificativaInput" class="label-flutuante">Justificativa</label>
                        </div>
                    </div>

                    <div class="form-1coluna">
                        <div class="form campo-flutuante">
                            <select id="idFuncionarioResponsavelSelect">
                                <option value="">Sem responsável vinculado</option>
                            </select>
                            <label for="idFuncionarioResponsavelSelect" class="label-flutuante opcional">Funcionário responsável (opcional)</label>
                        </div>
                    </div>

                    <div class="form-1coluna">
                        <div class="form">
                            <select id="statusSelect">
                                <option value="Pendente">Pendente</option>
                                <option value="Pago">Pago</option>
                            </select>
                            <label for="statusSelect" class="label-flutuante">Status</label>
                        </div>
                    </div>

                    <div class="form-1coluna">
                        <div class="form campo-flutuante" id="containerComprovanteDespesa">
                            <span class="label-flutuante">Comprovante</span>
                            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
                                <label for="fileComprovanteDespesa" id="btnAnexarComprovanteDespesa" class="btn-upload-comprovante">
                                    <i class="fas fa-paperclip"></i> Anexar comprovante (opcional)
                                </label>
                                <a id="linkVerComprovanteDespesa" href="#" target="_blank" class="btn-upload-comprovante" style="display:none; background:#198754;">
                                    <i class="fas fa-eye"></i> Ver comprovante
                                </a>
                                <label for="fileComprovanteDespesa" id="btnSubstituirComprovanteDespesa" class="btn-upload-comprovante" style="display:none; background:#6c757d;">
                                    <i class="fas fa-sync-alt"></i> Substituir
                                </label>
                                <button type="button" id="btnRemoverComprovanteDespesa" class="btn-upload-comprovante" style="display:none; background:#c0392b; border:none;">
                                    <i class="fas fa-trash"></i> Remover
                                </button>
                            </div>
                            <input type="file" name="comprovantedespesa" id="fileComprovanteDespesa" accept="image/*,application/pdf" style="display:none;">
                            <input type="hidden" id="limparComprovanteDespesa" value="false">
                            <span id="nomeComprovanteDespesaEscolhido" style="font-size:0.82em; color:#555; margin-top:4px; display:block;">Nenhum arquivo selecionado</span>
                        </div>
                    </div>

                    <div class="previa-lancamentos">
                        <h3 id="tituloHistoricoDespesas">Lançamentos deste Evento</h3>
                        <div class="table-container">
                            <table class="table-previa">
                                <thead>
                                    <tr>
                                        <th>Categoria</th>
                                        <th>Data Ref.</th>
                                        <th>Tipo</th>
                                        <th>Valor</th>
                                        <th>Justificativa</th>
                                        <th>Responsável</th>
                                        <th>Status</th>
                                        <th>Comprovante</th>
                                        <th>Lançado em</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="corpoHistoricoDespesas">
                                    <tr><td colspan="10" style="text-align:center; color:#999;">Selecione um evento</td></tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </fieldset>
            </form>
        </div>

        <div class="BTNs">
            <button class="bntLimpar" id="Limpar" type="button">Limpar</button>
            <button type="button" id="Enviar" onclick="salvarDespesaExtra(event)">Enviar</button>
        </div>
    </div>
</div>
