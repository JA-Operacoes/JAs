<link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="stylesheet" href="css/MensagensSwal/mensagensSwal.css">
<link rel="stylesheet" href="css/Modal/CadPagamentos.css"> 
<link rel="stylesheet" href="css/Roots/Roots.css">

<div id="cadModalPagamentos" class="modal">
    <div class="modal-content">
        
        <div class="Close"><button class="close" id="Fechar"> X </button></div>

        <div id="form-pagamentos"> 
            <div class="title">
                <h1>Registro de Pagamentos</h1>
            </div>

            <form id="form" name="form">
                <section class="pagamento-secao">
                    <h3>Dados da Baixa / Pagamento</h3>

                    <div class="pagamento-campos pagamento-campos-lanc">
                        <div class="form2">
                            <label class="user-label" for="idPagamento">ID Pagto</label>
                            <input type="text" class="input" name="idPagamento" id="idPagamento" readonly>
                        </div>

                        <div class="form2">
                            <label class="user-label" for="descLancamento">Lançamento (Conta)</label>
                            <input type="text" class="input uppercase" id="descLancamento" autocomplete="off" placeholder="Digite para buscar (ex: Luz, Condomínio, Salário...)">
                            <select name="idLancamento" id="idLancamentoSelect" required style="display:none;">
                                <option value="" disabled selected>Selecione o Lançamento (Conta)...</option>
                            </select>
                        </div>
                    </div>

                    <div class="pagamento-campos">
                        <div class="form2">
                            <label class="user-label" for="dtvcto">Vencimento Original</label>
                            <input type="date" class="input" name="dtvcto" id="dtvcto" readonly>
                        </div>
                        <div class="form2">
                            <label class="user-label" for="vlrPrevisto">Valor Previsto (R$)</label>
                            <input type="text" class="input" name="vlrPrevisto" id="vlrPrevisto" oninput="formatReais(this)" readonly>
                        </div>
                        <div class="form2">
                            <label class="user-label" for="numParcela">Nº Parcela</label>
                            <input type="number" class="input" name="numParcela" id="numParcela" readonly>
                        </div>
                        <div class="form2">
                            <label class="user-label" for="vlrReal">Valor Real (R$)</label>
                            <input type="text" class="input" name="vlrReal" id="vlrReal" oninput="formatReais(this)" required>
                        </div>
                    </div>

                    <div class="pagamento-campos">
                        <div class="form2">
                            <label class="user-label" for="dtpgto">Data do Pagamento</label>
                            <input type="date" class="input" name="dtpgto" id="dtpgto" required>
                        </div>

                        <div class="form2">
                            <label class="user-label" for="vlrDespesasAtraso">Despesas Atraso (R$)</label>
                            <input type="text" class="input" name="vlrDespesasAtraso" id="vlrDespesasAtraso" oninput="formatReais(this)" required>
                        </div>

                        <div class="form2">
                            <label class="user-label" for="vlrDesconto">Desconto (R$)</label>
                            <input type="text" class="input" name="vlrDesconto" id="vlrDesconto" oninput="formatReais(this)" required>
                        </div>

                        <div class="form2">
                            <label class="user-label" for="vlrPago">Valor Efetivamente Pago (R$)</label>
                            <input type="text" class="input" name="vlrPago" id="vlrPago" oninput="formatReais(this)" required>
                        </div>
                    </div>

                    <div class="pagamento-campos pagamento-campos-1col">
                        <div class="form2">
                            <label class="user-label" for="observacaoPagto">Observações</label>
                            <input type="text" class="input uppercase" name="observacao" id="observacaoPagto" required>
                        </div>
                    </div>

                    <div class="form-checkbox" style="margin-top: 15px;">
                        <div class="checkbox-wrapper-33">
                            <label class="checkbox">
                                <p class="checkbox__textwrapper">Pagamento Confirmado</p>
                                <input class="checkbox__trigger visuallyhidden" type="checkbox" id="statusPagto" name="statusPagto" checked />
                                <span class="checkbox__symbol">
                                    <svg aria-hidden="true" class="icon-checkbox" width="28px" height="28px" viewBox="0 0 28 28">
                                        <path d="M4 14l8 7L24 7"></path>
                                    </svg>
                                </span>
                            </label>
                        </div>
                        <div class="pdf" style="display: none;">
                            <div class="collumn" id="colunaImagemConta">
                                <h5>Imagem da Conta/Boleto</h5>
                                <div class="containerPDF" id="containerInputConta">
                                    <button type="button" id="btnEscolherArquivoConta" class="btn-upload-arquivo" onclick="document.getElementById('arquivoConta').click()">
                                        <svg aria-hidden="true" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path stroke-width="2" stroke="#ffffff" d="M13.5 3H12H8C6.34315 3 5 4.34315 5 6V18C5 19.6569 6.34315 21 8 21H11M13.5 3L19 8.625M13.5 3V7.625C13.5 8.17728 13.9477 8.625 14.5 8.625H19M19 8.625V11.8125" stroke-linejoin="round" stroke-linecap="round"></path>
                                            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="#ffffff" d="M17 15V18M17 21V18M17 18H14M17 18H20"></path>
                                        </svg>
                                        Imagem da Conta
                                    </button>
                                    <p id="fileNameConta" class="fileNamePDF">Nenhum arquivo selecionado</p>
                                    <input id="arquivoConta" class="filePDFInput" type="file" name="imagemConta" accept="application/pdf,image/png,image/jpeg,image/gif,image/webp,image/bmp,image/jfif,image/svg+xml">
                                </div>
                                <div id="imagemContaDisplay" style="display: none; margin-top: 10px;">
                                    <div id="linkContainerConta"></div>
                                </div>
                            </div>
                            
                            <br>
                        
                            <div class="collumn" id="colunaComprovante">
                                <h5>Comprovante de Pagamento</h5>
                                <div class="containerPDF" id="containerInputComprovante">
                                    <button type="button" id="btnEscolherComprovante" class="btn-upload-arquivo" onclick="document.getElementById('comprovantePagto').click()">
                                        <svg aria-hidden="true" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                                            <path stroke-width="2" stroke="#ffffff" d="M13.5 3H12H8C6.34315 3 5 4.34315 5 6V18C5 19.6569 6.34315 21 8 21H11M13.5 3L19 8.625M13.5 3V7.625C13.5 8.17728 13.9477 8.625 14.5 8.625H19M19 8.625V11.8125" stroke-linejoin="round" stroke-linecap="round"></path>
                                            <path stroke-linejoin="round" stroke-linecap="round" stroke-width="2" stroke="#ffffff" d="M17 15V18M17 21V18M17 18H14M17 18H20"></path>
                                        </svg>
                                        Adicionar Comprovante
                                    </button>
                                    <p id="fileNameComprovante" class="fileNamePDF">Nenhum arquivo selecionado</p>
                                    <input id="comprovantePagto" class="filePDFInput" type="file" name="comprovantePagamento" accept="application/pdf,image/png,image/jpeg,image/gif,image/webp,image/bmp,image/jfif,image/svg+xml">
                                </div>
                                <div id="comprovantePagtoDisplay" style="display: none; margin-top: 10px;">
                                    <div id="linkContainerComprovante"></div>
                                </div>
                            </div>
                            <input type="hidden" name="limparComprovanteImagem" id="limparComprovanteImagem" value="false">
                            <input type="hidden" name="limparComprovantePagto" id="limparComprovantePagto" value="false">
                        </div>
                    </div>

                    <div class="previa-lancamentos">
                        <h3>Histórico de Pagamentos deste Lançamento</h3>
                        <div class="table-container">
                            <table class="table-previa">
                                <thead>
                                    <tr>
                                        <th>Parc.</th>
                                        <th>Vencimento</th>
                                        <th>Valor Pago</th>
                                        <th>Data Pago</th>
                                        <th>Status</th>
                                        <th>Observação</th>
                                        <th>Ações</th>
                                    </tr>
                                </thead>
                                <tbody id="corpoHistoricoPagto">
                                    </tbody>
                            </table>
                        </div>
                    </div>
                </section>
            </form>
        </div>

        <div class="BTNs">
            <!-- <button class="bntPesquisar" id="Pesquisar" type="button">Histórico</button> -->
            <button class="bntLimpar" id="Limpar" type="button">Limpar</button>
            <button type="button" id="Enviar" onclick="salvarPagamento(event)">Enviar</button>
        </div>
    </div>
</div>
