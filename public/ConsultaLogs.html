<link rel="stylesheet" href="css/Modal/ConsultaLogs.css">
<link rel="stylesheet" href="css/Roots/Roots.css">

<div id="ConsultaLogs" class="modal">
  <div class="modal-content">
    <div class="Close"><button class="close" id="Fechar"> X </button></div>

    <div id="form-content">
      <div class="title">
        <h1>Consulta de Logs</h1>
      </div>

      <fieldset class="logs-filtros">
        <legend>Filtros</legend>
        <div class="logs-filtros-grid">
          <div class="form2">
            <input type="text" id="logModuloBusca" class="logs-input-busca" placeholder=" " autocomplete="off">
            <input type="hidden" id="logModulo">
            <label class="logs-user-label" for="logModuloBusca">Módulo</label>
          </div>
          <div class="form2">
            <input type="text" id="logExecutorBusca" class="logs-input-busca" placeholder=" " autocomplete="off">
            <input type="hidden" id="logExecutor">
            <label class="logs-user-label" for="logExecutorBusca">Executor</label>
          </div>
          <div class="form2">
            <input type="text" id="logEmpresaBusca" class="logs-input-busca" placeholder=" " autocomplete="off">
            <input type="hidden" id="logEmpresa">
            <label class="logs-user-label" for="logEmpresaBusca">Empresa</label>
          </div>
          <div class="logs-campo">
            <input type="text" id="logFuncionarioBusca" class="logs-input-busca" placeholder=" " autocomplete="off">
            <input type="hidden" id="logIdFuncionario">
            <label class="logs-user-label" for="logFuncionarioBusca">Funcionário</label>
          </div>
          <div class="logs-campo">
            <input type="number" id="logIdRegistro" class="logs-input-busca" placeholder=" " min="1">
            <label class="logs-user-label" for="logIdRegistro">ID Registro Alterado</label>
          </div>
          <div class="logs-campo">
            <input type="date" id="logDataInicio" class="logs-input-busca" placeholder=" ">
            <label class="logs-user-label" for="logDataInicio">Data Início</label>
          </div>
          <div class="logs-campo">
            <input type="date" id="logDataFim" class="logs-input-busca" placeholder=" ">
            <label class="logs-user-label" for="logDataFim">Data Fim</label>
          </div>
        </div>

        <div class="logs-filtros-botoes">
          <button type="button" id="btnLimparLogs" class="btn-secundario">Limpar</button>
          <button type="button" id="btnBuscarLogs" class="btn-primario">Buscar</button>
        </div>
      </fieldset>

      <div class="logs-resultado-info">
        <span id="logsTotalInfo"></span>
      </div>

      <div class="logs-tabela-wrapper">
        <table class="report-table" id="tabelaLogs">
          <thead>
            <tr>
              <th class="th-sort" data-sort="criado_em">Data/Hora</th>
              <th class="th-sort" data-sort="empresa_nome">Empresa</th>
              <th class="th-sort" data-sort="modulo">Módulo</th>
              <th class="th-sort" data-sort="acao">Ação</th>
              <th class="th-sort" data-sort="executor_nome">Executor</th>
              <th class="th-sort" data-sort="idregistroalterado">Registro Alterado</th>
              <th class="th-sort" data-sort="usuarioalvo_nome">Usuário Alvo</th>
              <th>Dados</th>
            </tr>
          </thead>
          <tbody id="logsTbody">
            <tr><td colspan="8" class="logs-vazio">Use os filtros acima e clique em Buscar.</td></tr>
          </tbody>
        </table>
      </div>

      <div class="logs-paginacao">
        <button type="button" id="btnLogsAnterior" class="btn-secundario">‹ Anterior</button>
        <span id="logsPaginaAtual">Página 1</span>
        <button type="button" id="btnLogsProxima" class="btn-secundario">Próxima ›</button>
      </div>
    </div>
  </div>
</div>
