<link href="https://fonts.googleapis.com/css2?family=Abel&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
<link rel="stylesheet" href="css/MensagensSwal/mensagensSwal.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">
<link rel="stylesheet" href="css/Roots/Roots.css">
<link rel="stylesheet" href="css/Modal/CadPlanoSaude.css">

<div id="cadModalPlanoSaude" class="modal">
  <div class="modal-content">

    <div class="Close"><button class="close" id="Fechar" type="button"> X </button></div>

    <div id="form-PlanoSaude">

      <div class="title">
        <h1>Plano de Saúde</h1>
      </div>

      <form id="planosaude" name="form" autocomplete="off">

        <!-- Nome do plano + cadastro dos tipos -->
        <section class="plano-secao">
          <div class="plano-secao-topo">
            <div class="container-planos">
              <div class="form2">
                  <input type="text" id="nmPlano" class="input">
                  <label class="user-label" for="nmPlano">Nome do Plano</label>
                </div>
              <div class="form2">
                  <input type="text" id="nmTipo" class="input">
                  <label class="user-label" for="nmTipo">Tipo de Plano</label>
                </div>
            </div>
            <button type="button" id="plano-add-tipo" class="plano-add">Adicionar tipos de Planos</button>
              <div id="planosContainer" class="planos-container"></div>
            </div>
        </section>

        <!-- valores dos tipos de Planos -->
        <section class="plano-secao">
          <h3>Tipos de Planos
          <select name="tpPlanos" id="tpPlanos" class="input">
            <option value="">Selecione um tipo…</option>
          </select></h3>
          <table class="plano-tabela" id="plano-faixas">
            <thead><tr><th>De (Idade)</th><th>Até (Idade)</th><th>Valor cobrado (R$)</th><th></th></tr></thead>
            <tbody></tbody>
          </table>
          <button type="button" id="plano-add-faixa" class="plano-add">+ faixa de Valores</button>
          <span class="plano-hint">Selecione um tipo acima para editar suas faixas. A última faixa pode ficar sem "Até" (idade em diante).</span>
        </section>
      </form>
    </div>

    <div class="BTNs">
      <Button class="btnPesquisar" id="Pesquisar" type="button">Pesquisar</Button>
      <button class="btnLimpar" id="Limpar" type="button">Limpar</button>
      <button class="btnEnviar" id="Enviar" type="button">Salvar</button>
    </div>

  </div>
</div>
